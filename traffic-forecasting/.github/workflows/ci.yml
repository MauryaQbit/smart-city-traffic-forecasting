name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv pip install --system -e ".[lstm,dashboard,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Fast tests
        run: pytest -q -m "not slow"

      - name: Import smoke
        run: |
          python -c "import traffic_forecast; from traffic_forecast import pipeline; from traffic_forecast.dashboard import app"

  characterization:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install
        run: uv pip install --system -e ".[lstm,dashboard,dev]"

      - name: Generate data + train
        run: |
          tf-generate-data
          tf-train-all

      - name: Characterization tests
        run: pytest -q -m "characterization"
